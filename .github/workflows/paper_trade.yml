name: Paper trade (OKX Demo – live)

# Her 15 dakikada bir paper_trade.py'i OKX demo hesabinda gercek order ile calistirir.
# Gerekli GitHub Secrets:
#   OKX_API_KEY / OKX_API_SECRET / OKX_PASSPHRASE   (demo API key)
#   TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID            (bildirim, opsiyonel)
#
# Manuel calistirma: Actions -> Paper trade -> Run workflow

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = OKX order atma, sadece sinyal goster'
        required: false
        default: 'false'
      probe:
        description: 'Test icin N bar geriye git (production = 0)'
        required: false
        default: '0'

concurrency:
  group: paper-trade
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-paper.txt

      - name: Install deps
        run: pip install -r requirements-paper.txt

      - name: Run paper trade (OKX Demo)
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          OKX_DEMO: 'true'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          dry="${{ github.event.inputs.dry_run || 'false' }}"
          probe="${{ github.event.inputs.probe || '0' }}"
          extra=""
          if [ "$dry" = "true" ]; then extra="$extra --dry-run --source mexc"; fi
          if [ "$probe" -gt 0 ] 2>/dev/null; then extra="$extra --probe $probe"; fi
          python paper_trade.py $extra | tee run.log

      - name: Build dashboard
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          OKX_DEMO: 'true'
          DASHBOARD_MODE: live
        run: python dashboard_build.py

      - name: Commit log + dashboard if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          changed=0
          if ! git diff --quiet paper_trade_log.json; then
            git add paper_trade_log.json
            changed=1
          fi
          if ! git diff --quiet docs/; then
            git add docs/
            changed=1
          fi
          if [ "$changed" = "1" ]; then
            git commit -m "chore(trade): update log + dashboard [skip ci]"
            git push
          else
            echo "Degisiklik yok."
          fi
